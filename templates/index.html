<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltaic Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: #0a0a0f; color: #f0f0f5; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.setup { background: #161822; border: 1px solid #26293b; border-radius: 20px; padding: 40px; width: 90%; max-width: 420px; text-align: center; }
.setup h1 { font-size: 22px; margin-bottom: 8px; background: linear-gradient(135deg, #7b2ffc, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.setup p { font-size: 13px; color: #8a8d9e; margin-bottom: 20px; }
.setup input { width: 100%; background: #0a0a0f; border: 1px solid #26293b; border-radius: 12px; padding: 14px 16px; color: white; font-size: 14px; outline: none; margin-bottom: 12px; }
.setup input:focus { border-color: #7b2ffc; }
.setup button { width: 100%; background: #7b2ffc; border: none; border-radius: 12px; padding: 14px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
.setup button:hover { background: #6a1de0; }
.setup small { display: block; margin-top: 16px; font-size: 11px; color: #5a5d6e; }
.chat { display: none; flex-direction: column; height: 100vh; width: 100%; }
header { padding: 16px 24px; border-bottom: 1px solid #26293b; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #7b2ffc, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header span { font-size: 12px; color: #8a8d9e; }
header .logout { margin-left: auto; background: #26293b; border: none; border-radius: 8px; padding: 6px 14px; color: #8a8d9e; font-size: 12px; cursor: pointer; }
header .logout:hover { background: #3a3d4e; }
#chatBox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.user { background: #7b2ffc; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.bot { background: #161822; color: #f0f0f5; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #26293b; }
.bottom { padding: 16px 24px; border-top: 1px solid #26293b; display: flex; gap: 8px; align-items: center; }
.bottom input { flex: 1; background: #161822; border: 1px solid #26293b; border-radius: 12px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
.bottom input:focus { border-color: #7b2ffc; }
.bottom button { background: #7b2ffc; border: none; border-radius: 12px; padding: 12px 20px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
.bottom .mic { background: #161822; border: 1px solid #26293b; border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: all .2s; }
.bottom .mic:hover { border-color: #7b2ffc; }
.bottom .mic.activo { background: #dc2626; border-color: #dc2626; animation: pulse .8s infinite; }
.bottom .mic.activo::after { content: ''; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); } 100% { box-shadow: 0 0 0 14px rgba(220,38,38,0); } }
.escuchando { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.loading { opacity: .5; }
</style>
</head>
<body>
<!-- Setup: pedir codigo de usuario + API Key -->
<div class="setup" id="setupScreen">
  <div style="font-size:40px;margin-bottom:12px">🤖</div>
  <h1>Voltaic AI Chat</h1>
  <p>Ingresa tu codigo de usuario para comenzar.</p>
  <input id="userCode" placeholder="Tu codigo (ej: cristian, demo)">
  <input id="keyInput" type="password" placeholder="API Key DeepSeek (opcional, usa la compartida si no tienes)">
  <button onclick="guardarKey()">Conectar</button>
  <small>Los codigos los crea Cristian. Si no tienes, pidele uno.</small>
  <small style="margin-top:4px">Tu conversacion queda solo en tu navegador. Nadie mas la ve.</small>
</div>

<!-- Chat -->
<div class="chat" id="chatScreen">
<header>
  <span style="width:10px;height:10px;border-radius:50%;background:#00d4ff;display:inline-block"></span>
  <h1>Voltaic AI Chat</h1>
  <span id="estadoMic">DeepSeek</span>
  <button class="logout" onclick="cerrarSesion()">Cambiar Key</button>
</header>
<div id="chatBox">
  <div class="msg bot">¡Hola! Soy Catalina, tu asistente con IA. Escribe tu mensaje</div>
</div>
<div class="bottom">
  <button id="btnMic" class="mic" onclick="alternarEscucha()" title="Toca para hablar">&#127908;</button>
  <input id="input" placeholder="Escribe, o toca el microfono para hablar..." onkeydown="if(event.key=='Enter') enviar()">
  <button onclick="enviar()">Enviar</button>
</div>
</div>

<script>
const KEY_STORAGE = 'voltaic_user_';
let apiKey = '';
let escuchando = false;
let recognition = null;
let audioDesbloqueado = false;

// ---------- DESBLOQUEO DE AUDIO PARA IPHONE/SAFARI ----------
// iOS Safari bloquea la voz hasta que el usuario toca la pantalla.
function desbloquearAudio() {
  if (audioDesbloqueado) return;
  audioDesbloqueado = true;
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const s = new SpeechSynthesisUtterance(' ');
      s.volume = 0;
      window.speechSynthesis.speak(s);
      window.speechSynthesis.cancel();
    } catch(_) {}
  }
}
document.addEventListener('touchstart', desbloquearAudio, { passive: true });
document.addEventListener('click', desbloquearAudio, { passive: true });

function guardarKey() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key || !key.startsWith('sk-')) { alert('Ingresa una key válida (empieza con sk-)'); return; }
  apiKey = key;
  localStorage.setItem(KEY_STORAGE, key);
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  desbloquearAudio();
}

function cerrarSesion() {
  localStorage.removeItem(KEY_STORAGE);
  apiKey = '';
  detenerVoz();
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'flex';
  document.getElementById('keyInput').value = '';
  document.getElementById('chatBox').innerHTML = '<div class="msg bot">¡Hola! Soy Catalina, tu asistente con IA. Escribe tu mensaje</div>';
}

// Auto-cargar si ya hay key guardada
(function() {
  const params = new URLSearchParams(window.location.search);
  const urlUser = params.get('user');
  let lastUser = '', lastTime = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(KEY_STORAGE) && k.endsWith('_last')) {
      const t = parseInt(localStorage.getItem(k)) || 0;
      if (t > lastTime) { lastTime = t; lastUser = k.replace(KEY_STORAGE, '').replace('_last', ''); }
    }
  }
  const activeUser = urlUser || lastUser;
  if (activeUser) {
    document.getElementById('userCode').value = activeUser;
    const savedKey = localStorage.getItem(KEY_STORAGE + activeUser + '_key');
    if (savedKey !== null) {
      apiKey = savedKey;
      userCode = activeUser;
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
    }
  }
})();

const chatBox = document.getElementById('chatBox');
const input = document.getElementById('input');
// Solo texto - sin microfono

function agregarMsg(texto, rol) {
  const div = document.createElement('div'); div.className = `msg ${rol}`; div.textContent = texto;
  chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
}

// ---------- VOZ DE SALIDA (hablar) ----------
function hablar(texto) {
  if (!('speechSynthesis' in window)) { agregarMsg('(Tu navegador no soporta voz de salida)', 'bot'); return; }
  window.speechSynthesis.cancel();
  // iOS Safari a veces necesita este retraso para que suene
  setTimeout(() => {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'es-CL'; voz.rate = 1.0; voz.pitch = 1.0;
    // Elegir voz en español si hay
    const voces = window.speechSynthesis.getVoices();
    const es = voces.find(v => v.lang && v.lang.startsWith('es'));
    if (es) voz.voice = es;
    window.speechSynthesis.speak(voz);
  }, 50);
}

// Cargar voces (necesario en iOS para getVoices)
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

// ---------- ENVIAR ----------
async function enviar() {
  const msg = input.value.trim(); if (!msg) return;
  input.value = ''; agregarMsg(msg, 'user');
  const loading = document.createElement('div'); loading.className = 'msg bot loading'; loading.textContent = '...';
  chatBox.appendChild(loading);
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg, api_key:apiKey}) });
    const data = await res.json(); chatBox.removeChild(loading);
    if (data.response) { agregarMsg(data.response, 'bot'); hablar(data.response); }
    else { agregarMsg('Error: ' + (data.error||'desconocido'), 'bot'); }
  } catch(e) { chatBox.removeChild(loading); agregarMsg('Error de conexión', 'bot'); }
}
</script>
</body>
</html>
